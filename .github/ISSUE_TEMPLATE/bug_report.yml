name: Bug report
description: Something went wrong, or Mothball moved something it shouldn't have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If you opened this from Mothball's Settings, your version and system are already filled in.

        **Moved something it shouldn't have?** It's in the Trash (the Recycle Bin on Windows), so you can put it back from there. Please tell us below so no one else hits it.

        Found a security problem? Please don't post it here; see [SECURITY.md](https://github.com/herocodess/mothball/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I clicked "Put away all" and…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: what-moved
    attributes:
      label: What did it move, if anything?
      description: The folder it moved and the project it belonged to. The Lately list in the app shows recent moves.
      placeholder: |
        ~/dev/my-app/build
        It was a Flutter project with uncommitted changes.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Mothball version
      description: Shown in Settings, or run `mothball version`.
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      placeholder: Apple silicon, Intel, x64 (Intel or AMD), Arm64
    validations:
      required: false
  - type: dropdown
    id: how
    attributes:
      label: How do you use Mothball?
      options:
        - The app
        - The command line tool
        - Both
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Anything else?
      description: Screenshots, error messages, or command output.
      render: text
    validations:
      required: false
