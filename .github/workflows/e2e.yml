name: end to end

# Runs the real mothball binary against fake projects on every system we
# ship for, and builds and opens the desktop app on Windows and Linux with a
# screenshot of each, so they are checked without owning those machines.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Workflows only read the code; a pull request cannot use them to write to the repo.
permissions:
  contents: read

jobs:
  cli:
    name: cli (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x64, os: ubuntu-latest }
          - { name: linux arm64, os: ubuntu-24.04-arm }
          - { name: windows x64, os: windows-latest }
          - { name: windows arm64, os: windows-11-arm }
          - { name: macos arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Which machine
        shell: bash
        run: |
          go env GOOS GOARCH
          git --version; (npm --version || true); (python --version || python3 --version || true)
      - name: End to end tests
        shell: bash
        run: go test -tags e2e -count=1 -v ./e2e/

  desktop:
    name: desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x64, os: ubuntu-latest }
          - { name: windows x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev xvfb imagemagick libgl1-mesa-dri

      - name: Build the app (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          flutter build linux --release
          B=build/linux/x64/release/bundle
          mkdir -p $B/bin
          (cd .. && go build -o app/$B/bin/mothball ./cli/mothball)
          ls -la $B $B/bin

      - name: Build the app (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release
          $B = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force "$B\bin" | Out-Null
          Push-Location ..; go build -o "app\$B\bin\mothball.exe" ./cli/mothball; Pop-Location
          Get-ChildItem $B, "$B\bin" | Format-Table Name, Length

      - name: Open it and take a screenshot (Linux)
        if: runner.os == 'Linux'
        working-directory: app/build/linux/x64/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/shots"
          ./bin/mothball service run --no-tray > "$GITHUB_WORKSPACE/shots/service.log" 2>&1 &
          sleep 3
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            ./mothball-app > "$GITHUB_WORKSPACE/shots/app.log" 2>&1 &
            APP=$!
            sleep 20
            import -window root "$GITHUB_WORKSPACE/shots/linux-x64.png"
            kill -0 $APP || { echo "the app exited"; cat "$GITHUB_WORKSPACE/shots/app.log"; exit 1; }
            kill $APP'
          ./bin/mothball status

      - name: Open it and take a screenshot (Windows)
        if: runner.os == 'Windows'
        working-directory: app/build/windows/x64/runner/Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\shots" | Out-Null
          Start-Process -FilePath ".\bin\mothball.exe" -ArgumentList "service","run","--no-tray" -WindowStyle Hidden
          Start-Sleep 3
          $app = Start-Process -FilePath ".\Mothball.exe" -PassThru
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\shots\windows-x64.png")
          if ($app.HasExited) { Write-Error "the app exited with $($app.ExitCode)"; exit 1 }
          Stop-Process -Id $app.Id
          .\bin\mothball.exe status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: shots/
