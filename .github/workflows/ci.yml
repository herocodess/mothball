name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core and cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build CLI
        run: go build -o dist/ ./cli/mothball

  app:
    name: desktop app (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: flutter analyze
        run: |
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1 || status=$?
          awk -F'|' 'NF>=8 {printf "::%s file=app/%s,line=%s,col=%s::%s %s\n", ($1=="ERROR"?"error":"warning"), substr($4, index($4,"/lib/")?index($4,"lib/"):index($4,"test/")), $5, $6, $3, $8}' analyze.txt
          exit ${status:-0}
      - run: flutter test
